<mat-card class="product-card">
  <mat-card-header>
    <mat-card-title>Product Name</mat-card-title>
    <mat-card-subtitle>Category</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>
      This is a brief description of the product. It provides an overview of the features and benefits.
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button matbutton>Add to card</button>
  </mat-card-actions>
</mat-card>
